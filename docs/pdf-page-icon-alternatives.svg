<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
  <rect width="920" height="360" rx="24" fill="#0f172a"/>
  <text x="460" y="42" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">PDF 페이지 아이콘 후보</text>

  <!-- A: overlapping pages -->
  <g transform="translate(45 70)">
    <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
    <g transform="translate(57 48) scale(3)" fill="none" stroke="#dbe7f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 6V4h12v15h-2"/>
      <rect x="5" y="6" width="12" height="15" rx="1.5"/>
      <path d="M8 10h6M8 14h6M8 18h4"/>
    </g>
    <text x="90" y="215" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">A. 겹친 페이지</text>
    <text x="90" y="241" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">여러 페이지를 직관적으로 표현</text>
  </g>

  <!-- B: thumbnail grid -->
  <g transform="translate(260 70)">
    <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
    <g transform="translate(57 48) scale(3)" fill="none" stroke="#dbe7f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="7" height="8" rx="1"/>
      <rect x="13" y="4" width="7" height="8" rx="1"/>
      <rect x="4" y="14" width="7" height="6" rx="1"/>
      <rect x="13" y="14" width="7" height="6" rx="1"/>
    </g>
    <text x="90" y="215" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">B. 썸네일 격자</text>
    <text x="90" y="241" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">페이지 정리 기능을 강하게 표현</text>
  </g>

  <!-- C: page stack tabs -->
  <g transform="translate(475 70)">
    <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
    <g transform="translate(57 48) scale(3)" fill="none" stroke="#dbe7f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 7V4h11v3"/>
      <path d="M4 10V7h15v3"/>
      <rect x="3" y="10" width="18" height="10" rx="1.5"/>
      <path d="M7 14h10M7 17h7"/>
    </g>
    <text x="90" y="215" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C. 페이지 묶음</text>
    <text x="90" y="241" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">파일 묶음·합치기 느낌이 강함</text>
  </g>

  <!-- D: open document/book -->
  <g transform="translate(690 70)">
    <rect width="180" height="180" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
    <g transform="translate(57 48) scale(3)" fill="none" stroke="#dbe7f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 5.5c3-1 6-.5 9 2v13c-3-2.5-6-3-9-2z"/>
      <path d="M21 5.5c-3-1-6-.5-9 2v13c3-2.5 6-3 9-2z"/>
      <path d="M12 7.5v13"/>
    </g>
    <text x="90" y="215" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">D. 펼친 문서</text>
    <text x="90" y="241" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">읽기·목차 이동 느낌이 강함</text>
  </g>

  <rect x="43" y="325" width="184" height="4" rx="2" fill="#4f8ff7"/>
  <text x="460" y="328" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">권장 순서: A 겹친 페이지  →  B 썸네일 격자  →  C 페이지 묶음  →  D 펼친 문서</text>
</svg>
